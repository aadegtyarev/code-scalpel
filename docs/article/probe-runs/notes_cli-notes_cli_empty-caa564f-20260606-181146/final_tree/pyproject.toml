[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-cli"
version = "0.1.0"
description = "A simple CLI for managing notes"
authors = [{ name="Your Name", email="your.email@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.7"

[project.scripts]
notes-cli = "app:main"

[tool.setuptools]
packages = ["app"]