[build-system]
requires = ['setuptools', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'notes'
version = '0.1.0'
description = 'CLI для заметок'
authors = [{name='Your Name', email='your.email@example.com'}]
license = {file='LICENSE.txt'}
readme = 'README.md'
requires-python = '>=3.8'

[project.scripts]
notes = 'notes:main'

[tool.ruff]
line-length = 88
select = ['E', 'F', 'W503']