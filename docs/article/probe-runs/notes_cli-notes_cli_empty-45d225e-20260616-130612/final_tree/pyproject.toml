[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notes-cli"
version = "0.1.0"
description = "Консольная утилита для управления заметками с JSON-хранилищем"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
notes = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
