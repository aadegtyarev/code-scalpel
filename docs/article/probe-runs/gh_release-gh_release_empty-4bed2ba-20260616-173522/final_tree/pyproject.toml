[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-release-publisher"
version = "0.1.0"
description = "CLI для публикации GitHub-релизов: парсинг CHANGELOG.md, создание релиза через REST API, загрузка бинарников"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "requests>=2.31",
]

[project.scripts]
publish-github-release = "github_release_publisher.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
