[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notes-cli"
version = "0.0.0"
description = "CLI-утилита для управления заметками с хранением в JSON"
requires-python = ">=3.11"
dependencies = ["click>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
notes = "notes_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
