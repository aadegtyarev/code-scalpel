[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-cli"
version = "0.1.0"
description = "CLI для управления заметками"
authors = [{ name="Your Name", email="your.email@example.com" }]
license = { file="LICENSE" }
readme = "README.md"
requires-python = ">=3.7"

[project.scripts]
notes-cli = "notes.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]