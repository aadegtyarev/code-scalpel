[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notes-cli"
version = "0.0.0"
description = "CLI for managing notes with JSON storage"
requires-python = ">=3.11"
dependencies = ["typer>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
notes = "notes_cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
