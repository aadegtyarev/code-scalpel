[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notes"
version = "0.1.0"
description = "CLI для управления заметками"
authors = [{ name="Your Name", email="your.email@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
notes-cli = "notes.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]