[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "book-club-bot"
version = "0.1.0"
description = "Асинхронный Telegram-бот «Книжный клуб» на aiogram 3 и SQLite"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0.0",
    "aiosqlite",
]

[tool.pytest.ini_options]
pythonpath = ["."]
