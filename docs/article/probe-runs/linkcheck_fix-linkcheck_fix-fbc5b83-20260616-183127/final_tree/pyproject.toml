[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "link-checker"
version = "0.1.0"
description = "Утилита для поиска и проверки ссылок в .md файлах"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
