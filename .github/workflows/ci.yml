name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,diagrams]"
          pip install bandit detect-secrets

      - name: Build-beat quality (ruff, mypy, pytest)
        run: node .ai-dev/quality/run.mjs build

      - name: Review-beat quality (bandit, detect-secrets)
        run: node .ai-dev/quality/run.mjs review
